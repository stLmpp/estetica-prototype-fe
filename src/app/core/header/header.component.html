<header
  class="flex h-[75px] w-full items-center border-b border-neutral-200 bg-neutral-50 px-8 font-sans
    dark:border-neutral-800 dark:bg-neutral-900"
>
  @let org = organization();
  <div class="mx-auto flex w-full max-w-[1200px] items-center justify-between">
    <div class="flex items-center gap-4">
      @if (org) {
        <button
          type="button"
          iconBtn
          btnSecondary
          ariaLabel="Open menu"
          aria-controls="sidebar-menu"
          [icon]="LucideMenu"
          [attr.aria-expanded]="sidebarService.isOpen()"
          (click)="toggleSidebar()"
        ></button>
      }
      <div class="text-primary-800 dark:text-primary-200 text-xl font-bold">
        <span>Estética Prototype</span>
      </div>
    </div>

    @if (isLoggedIn()) {
      <div class="flex items-center gap-4 text-sm text-neutral-700 dark:text-neutral-300">
        @if (org) {
          <a btn type="button" routerLink="/organizations">{{ org.name }}</a>
          <span class="text-neutral-300 dark:text-neutral-600">|</span>
        }
        <span class="text-neutral-600 dark:text-neutral-400">{{ user()?.name }}</span>
        <button
          type="button"
          iconBtn
          btnSecondary
          ariaLabel="Toggle dark mode"
          [icon]="theme() === 'dark' ? LucideSun : LucideMoon"
          (click)="changeTheme()"
        ></button>
        <button
          type="button"
          iconBtn
          btnSecondary
          ariaLabel="Logout"
          [icon]="LucideLogOut"
          (click)="logout()"
        ></button>
      </div>
    }
  </div>
</header>
