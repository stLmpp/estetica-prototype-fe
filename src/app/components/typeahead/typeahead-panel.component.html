<ul
  role="listbox"
  [id]="panelId()"
  [loadingOverlay]="loading()"
  class="flex flex-col gap-0.5 rounded-xl border border-neutral-200 bg-white p-1 shadow-lg dark:border-neutral-700 dark:bg-neutral-800"
>
  @for (item of items(); track item.id) {
    <app-typeahead-option [item]="item" (selected)="optionSelected.emit($event)" />
  } @empty {
    <li class="px-3 py-2 text-sm text-neutral-500 dark:text-neutral-400">{{ emptyMessage() }}</li>
  }
</ul>
