<div class="flex items-center justify-between">
  <button
    iconBtn
    size="sm"
    ariaLabel="Mês anterior"
    [icon]="LucideChevronLeft"
    [disabled]="disabled()"
    (click)="previousMonth()"
  ></button>
  <span class="text-sm font-semibold text-neutral-800 dark:text-neutral-100">
    {{ monthLabel() }}
  </span>
  <button
    iconBtn
    size="sm"
    ariaLabel="Próximo mês"
    [icon]="LucideChevronRight"
    [disabled]="disabled()"
    (click)="nextMonth()"
  ></button>
</div>

<div
  class="mt-3 grid grid-cols-7 gap-1 text-center text-xs font-medium text-neutral-500
    dark:text-neutral-400"
>
  @for (label of weekdayLabels; track label) {
    <span>{{ label }}</span>
  }
</div>

<div class="mt-1 grid grid-cols-7 gap-1">
  @for (day of days(); track day.date) {
    <button
      class="rounded-lg py-1.5 text-sm transition-colors"
      type="button"
      [class.text-neutral-400]="!day.isCurrentMonth && !day.isDisabled"
      [class.dark:text-neutral-600]="!day.isCurrentMonth && !day.isDisabled"
      [class.text-neutral-800]="day.isCurrentMonth && value() !== day.date && !day.isDisabled"
      [class.dark:text-neutral-100]="day.isCurrentMonth && value() !== day.date && !day.isDisabled"
      [class.hover:bg-neutral-100]="value() !== day.date && !day.isDisabled"
      [class.dark:hover:bg-neutral-700]="value() !== day.date && !day.isDisabled"
      [class.bg-primary-500]="value() === day.date"
      [class.text-white]="value() === day.date"
      [class.ring-2]="day.isToday && value() !== day.date"
      [class.ring-primary-400]="day.isToday && value() !== day.date"
      [class.text-neutral-300]="day.isDisabled"
      [class.dark:text-neutral-700]="day.isDisabled"
      [class.cursor-not-allowed]="day.isDisabled"
      [disabled]="disabled() || day.isDisabled"
      (click)="selectDay(day)"
    >
      {{ day.dayOfMonth }}
    </button>
  }
</div>
