<ol role="tablist" [attr.aria-orientation]="orientation" class="flex items-center">
  @for (step of stepsInternal(); track step; let index = $index; let last = $last) {
    <li class="flex flex-1 items-center gap-2">
      <button
        type="button"
        cdkStepHeader
        [id]="step.stepLabelId"
        [attr.aria-selected]="step.isSelected()"
        [attr.aria-controls]="step.stepContentId"
        [disabled]="!step.isNavigable()"
        class="flex cursor-pointer items-center gap-2 focus:outline-none disabled:cursor-not-allowed"
        (click)="onHeaderClick(index)"
        (keydown)="_onKeydown($event)"
      >
        <span
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-semibold"
          [class]="{
            'bg-primary-500': index <= selectedIndex,
            'text-white': index <= selectedIndex,
            'bg-neutral-200': index > selectedIndex,
            'text-neutral-500': index > selectedIndex,
            'dark:bg-neutral-700': index > selectedIndex,
          }"
        >
          {{ index + 1 }}
        </span>
        <span
          class="hidden text-xs font-medium sm:inline"
          [class]="{
            'text-primary-700': index <= selectedIndex,
            'dark:text-primary-300': index <= selectedIndex,
            'text-neutral-400': index > selectedIndex,
          }"
        >
          {{ step.label }}
        </span>
      </button>

      @if (!last) {
        <span class="h-px flex-1 bg-neutral-200 dark:bg-neutral-700"></span>
      }
    </li>
  }
</ol>
