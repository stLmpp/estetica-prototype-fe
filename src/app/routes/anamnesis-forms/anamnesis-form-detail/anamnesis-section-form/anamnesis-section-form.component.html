<h4 class="mb-3 text-sm font-bold text-neutral-800 dark:text-neutral-100">
  {{ isEditing() ? 'Editar seção' : 'Nova seção' }}
</h4>

<form [formRoot]="f" class="flex flex-col gap-3">
  <app-form-field>
    <label appLabel for="anamnesis-section-label">Nome</label>
    <input appInput [formField]="f.label" id="anamnesis-section-label" type="text" />
  </app-form-field>

  <app-form-field>
    <label appLabel for="anamnesis-section-display-order">Ordem de exibição</label>
    <input
      appInput
      [formField]="f.displayOrder"
      id="anamnesis-section-display-order"
      type="number"
      inputmode="numeric"
    />
  </app-form-field>

  <app-form-field>
    <app-switch [formField]="f.active">Ativa</app-switch>
  </app-form-field>

  @if (submitErrorMessage(); as message) {
    <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message }}</p>
  }

  <div class="flex justify-end gap-3">
    <button btn btnOutline type="button" [disabled]="f().submitting()" (click)="cancel()">
      Cancelar
    </button>
    <button
      btn
      btnPrimary
      type="submit"
      [disabled]="isEditing() && !f().dirty()"
      [btnLoading]="f().submitting()"
    >
      {{ isEditing() ? 'Salvar' : 'Criar' }}
    </button>
  </div>
</form>
