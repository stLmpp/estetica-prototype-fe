<div>
  <a
    routerLink="/anamnesis-forms"
    class="text-primary-600 dark:text-primary-300 text-sm hover:underline"
  >
    ← Voltar para anamneses
  </a>
</div>

<h1 class="text-primary-800 dark:text-primary-300 text-2xl font-bold">Novo formulário</h1>

<form [formRoot]="f" class="mt-4 flex max-w-lg flex-col gap-4">
  <app-form-field>
    <label appLabel for="anamnesis-form-name">Nome</label>
    <input appInput [formField]="f.name" id="anamnesis-form-name" type="text" />
  </app-form-field>

  <app-form-field>
    <label appLabel for="anamnesis-form-description">Descrição</label>
    <input appInput [formField]="f.description" id="anamnesis-form-description" type="text" />
  </app-form-field>

  <app-form-field>
    <label appLabel for="anamnesis-form-display-order">Ordem de exibição</label>
    <input
      appInput
      [formField]="f.displayOrder"
      id="anamnesis-form-display-order"
      type="number"
      inputmode="numeric"
    />
  </app-form-field>

  <app-form-field>
    <app-switch [formField]="f.active">Ativo</app-switch>
  </app-form-field>

  @if (submitErrorMessage(); as message) {
    <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message }}</p>
  }

  <div class="mt-2 flex justify-end gap-3">
    <a btn btnOutline routerLink="/anamnesis-forms">Cancelar</a>
    <button btn btnPrimary type="submit" [btnLoading]="f().submitting()">Criar</button>
  </div>
</form>
