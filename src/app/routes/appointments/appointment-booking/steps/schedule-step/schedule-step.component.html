<form [formRoot]="f" class="flex flex-col gap-4">
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-[auto_1fr]">
    <app-calendar [formField]="f.date" />

    <div [loadingOverlay]="store.dayScheduleLoading()">
      @if (store.dayScheduleErrorMessage(); as message) {
        <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message }}</p>
      } @else {
        <p class="mb-2 text-sm font-semibold text-neutral-700 dark:text-neutral-300">
          Horário de início
        </p>
        <div class="grid grid-cols-4 gap-2 sm:grid-cols-6">
          @for (slot of timeSlots(); track slot.time) {
            <button
              type="button"
              class="rounded-lg py-1.5 text-sm transition-colors"
              [disabled]="slot.busy"
              [class.bg-primary-500]="f.startTime().value() === slot.time"
              [class.text-white]="f.startTime().value() === slot.time"
              [class.text-neutral-400]="slot.busy && f.startTime().value() !== slot.time"
              [class.dark:text-neutral-600]="slot.busy && f.startTime().value() !== slot.time"
              [class.line-through]="slot.busy"
              [class.text-neutral-800]="!slot.busy && f.startTime().value() !== slot.time"
              [class.dark:text-neutral-100]="!slot.busy && f.startTime().value() !== slot.time"
              [class.hover:bg-neutral-100]="!slot.busy && f.startTime().value() !== slot.time"
              [class.dark:hover:bg-neutral-700]="!slot.busy && f.startTime().value() !== slot.time"
              (click)="selectStartTime(slot)"
            >
              {{ slot.time }}
            </button>
          }
        </div>
      }
    </div>
  </div>

  <app-form-field>
    <label appLabel for="appointment-duration">Duração (minutos)</label>
    <input
      appInput
      [formField]="f.durationMinutes"
      id="appointment-duration"
      type="number"
      inputmode="numeric"
    />
  </app-form-field>

  <p class="text-sm text-neutral-500 dark:text-neutral-400">
    Início: {{ f.startTime().value() }} — Término previsto: {{ computeEndTimeLabel() }}
  </p>

  <app-form-field>
    <label appLabel for="appointment-price">Preço aplicado</label>
    <input
      appInput
      [formField]="f.priceApplied"
      id="appointment-price"
      type="text"
      inputmode="decimal"
      placeholder="Deixe em branco para usar o preço padrão do serviço"
    />
  </app-form-field>

  <app-form-field>
    <label appLabel for="appointment-notes">Observações</label>
    <input appInput [formField]="f.notes" id="appointment-notes" type="text" />
  </app-form-field>
</form>

<div class="mt-6 flex justify-between">
  <button btn btnOutline type="button" (click)="back()">Voltar</button>
  <button btn btnPrimary type="button" [disabled]="f().invalid()" (click)="next()">Avançar</button>
</div>
