<div [loadingOverlay]="store.servicesLoading()">
  @if (store.servicesErrorMessage(); as message) {
    <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message }}</p>
  } @else if (!store.servicesLoading()) {
    <app-listbox
      aria-label="Serviços"
      [cdkListboxValue]="selectedServiceIds()"
      (cdkListboxValueChange)="onServiceChange($event)"
    >
      @for (service of store.services(); track service.id) {
        <app-listbox-option [cdkOption]="service.id">{{ service.name }}</app-listbox-option>
      } @empty {
        <p class="px-3 py-2 text-sm text-neutral-500 dark:text-neutral-400">
          Nenhum serviço com profissional disponível.
        </p>
      }
    </app-listbox>
  }
</div>

<div class="mt-6 flex justify-between">
  <a btn btnOutline routerLink="../customer">Voltar</a>
  <a btn btnPrimary [disabled]="!store.service()" routerLink="../professional">Avançar</a>
</div>
