<div>
  <a
    class="text-primary-600 dark:text-primary-300 text-sm hover:underline"
    routerLink="/appointments"
  >
    ← Voltar para agendamentos
  </a>
</div>

<h1 class="text-primary-800 dark:text-primary-300 text-2xl font-bold">Novo agendamento</h1>

<app-stepper
  [linear]="true"
  [selectedIndex]="currentStepIndex()"
  (headerClick)="onHeaderClick($event)"
>
  @for (step of steps(); track step.path; let i = $index) {
    <app-step [label]="step.label" [completed]="step.isStepReachable" />
  }
</app-stepper>

<router-outlet />
