<h2
  class="mb-6 text-lg font-bold text-neutral-800 dark:text-neutral-100"
  id="catalog-item-form-dialog-title"
>
  {{ isEditing ? 'Editar item' : 'Novo item' }}
</h2>

<form class="flex flex-col gap-4" [formRoot]="f">
  <app-form-field>
    <label appLabel for="catalog-item-name">Nome</label>
    <input id="catalog-item-name" appInput type="text" [formField]="f.name" />
  </app-form-field>

  <app-form-field>
    <label appLabel for="catalog-item-type">Tipo</label>
    <select id="catalog-item-type" appSelect [formField]="f.itemType">
      <option [value]="CatalogItemType.Product">{{ CatalogItemType.Product }}</option>
      <option [value]="CatalogItemType.Service">{{ CatalogItemType.Service }}</option>
    </select>
  </app-form-field>

  <app-form-field>
    <label appLabel for="catalog-item-price">Preço padrão</label>
    <input
      id="catalog-item-price"
      appInput
      type="text"
      inputmode="decimal"
      mask="separator.2"
      separatorLimit="99999999"
      prefix="R$ "
      placeholder="19,90"
      [formField]="f.defaultPrice"
      [allowNegativeNumbers]="false"
    />
    <app-hint start>Opcional. Use ponto para casas decimais, ex: 19.90</app-hint>
  </app-form-field>

  @if (f.itemType().value() === CatalogItemType.Service) {
    <app-form-field>
      <label appLabel for="catalog-item-duration">Duração padrão (minutos)</label>
      <input
        id="catalog-item-duration"
        appInput
        type="number"
        inputmode="numeric"
        placeholder="60"
        [formField]="f.defaultDuration"
      />
    </app-form-field>
  }

  <app-form-field>
    <app-switch [formField]="f.active">Ativo</app-switch>
  </app-form-field>

  @if (submitErrorMessage(); as message) {
    <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message }}</p>
  }

  <div class="mt-2 flex justify-end gap-3">
    <button btn btnOutline type="button" [disabled]="f().submitting()" (click)="cancel()">
      Cancelar
    </button>
    <button
      btn
      btnPrimary
      type="submit"
      [disabled]="f().invalid() || f().submitting() || (isEditing && !f().dirty())"
      [btnLoading]="f().submitting()"
    >
      {{ isEditing ? 'Salvar' : 'Criar' }}
    </button>
  </div>
</form>
