<h2 class="mb-3 text-lg font-semibold text-neutral-800 dark:text-neutral-100">Dados do cliente</h2>

<form class="flex flex-col gap-4" [formRoot]="infoForm">
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-field>
      <label appLabel for="customer-birth-date">Data de nascimento</label>
      <input id="customer-birth-date" appInput type="date" [formField]="infoForm.birthDate" />
    </app-form-field>

    <app-form-field>
      <label appLabel for="customer-marital-status">Estado civil</label>
      <select id="customer-marital-status" appSelect [formField]="infoForm.maritalStatus">
        <option value="">Selecione</option>
        <option [value]="MaritalStatus.Single">{{ MaritalStatus.Single }}</option>
        <option [value]="MaritalStatus.Married">{{ MaritalStatus.Married }}</option>
        <option [value]="MaritalStatus.Divorced">{{ MaritalStatus.Divorced }}</option>
        <option [value]="MaritalStatus.Widowed">{{ MaritalStatus.Widowed }}</option>
      </select>
    </app-form-field>
  </div>

  <app-form-field>
    <label appLabel for="customer-email">E-mail</label>
    <input id="customer-email" appInput type="email" [formField]="infoForm.email" />
  </app-form-field>

  <app-form-field>
    <label appLabel for="customer-job-name">Profissão</label>
    <input id="customer-job-name" appInput type="text" [formField]="infoForm.jobName" />
  </app-form-field>

  <app-form-field>
    <label appLabel for="customer-address">Endereço</label>
    <input id="customer-address" appInput type="text" [formField]="infoForm.address" />
  </app-form-field>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-field>
      <label appLabel for="customer-zip-code">CEP</label>
      <input
        id="customer-zip-code"
        appInput
        type="text"
        inputmode="numeric"
        mask="00000-000"
        placeholder="00000-000"
        [formField]="infoForm.zipCode"
      />
    </app-form-field>

    <app-form-field>
      <label appLabel for="customer-neighborhood">Bairro</label>
      <input id="customer-neighborhood" appInput type="text" [formField]="infoForm.neighborhood" />
    </app-form-field>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-field>
      <label appLabel for="customer-city">Cidade</label>
      <input id="customer-city" appInput type="text" [formField]="infoForm.city" />
    </app-form-field>

    <app-form-field>
      <label appLabel for="customer-state">Estado</label>
      <input id="customer-state" appInput type="text" [formField]="infoForm.state" />
    </app-form-field>
  </div>

  @if (infoSaveErrorMessage(); as message) {
    <app-alert error>{{ message }}</app-alert>
  }

  @if (canUpdate()) {
    <div class="flex justify-end">
      <button
        btn
        btnPrimary
        type="button"
        [disabled]="!infoForm().dirty() || infoSaving()"
        [btnLoading]="infoSaving()"
        (click)="saveInfo()"
      >
        Salvar
      </button>
    </div>
  }
</form>
