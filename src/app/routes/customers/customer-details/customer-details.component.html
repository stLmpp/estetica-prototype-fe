<div>
  <a routerLink="/customers" class="text-primary-600 dark:text-primary-300 text-sm hover:underline">
    ← Voltar para clientes
  </a>
</div>

@if (store.customer(); as cust) {
  <div class="flex flex-col gap-6">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-primary-800 dark:text-primary-300 text-2xl font-bold">{{ cust.name }}</h1>
        @if (cust.jobName) {
          <p class="text-sm text-neutral-500 dark:text-neutral-400">{{ cust.jobName }}</p>
        }
      </div>

      @if (canDelete()) {
        <button btn btnOutline type="button" (click)="openDeleteDialog()">Excluir</button>
      }
    </div>

    <app-tabs [tabs]="tabs()" label="Seções do cliente" />

    <router-outlet />
  </div>
}
