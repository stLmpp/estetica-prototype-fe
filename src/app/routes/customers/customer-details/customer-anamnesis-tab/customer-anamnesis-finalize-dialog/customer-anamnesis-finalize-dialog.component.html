<h2
  id="customer-anamnesis-finalize-dialog-title"
  class="mb-6 text-lg font-bold text-neutral-800 dark:text-neutral-100"
>
  Finalizar anamnese
</h2>

<p class="mb-4 text-sm text-neutral-500 dark:text-neutral-400">
  Ao finalizar, a anamnese não poderá mais ser editada. Confirme o nome de quem revisou/preencheu
  este registro.
</p>

<form [formRoot]="f" class="flex flex-col gap-4">
  <app-form-field>
    <label appLabel for="customer-anamnesis-signed-by-name">Nome de quem assina</label>
    <input
      appInput
      [formField]="f.signedByName"
      id="customer-anamnesis-signed-by-name"
      type="text"
    />
  </app-form-field>

  @if (submitErrorMessage(); as message) {
    <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message }}</p>
  }

  <div class="mt-2 flex justify-end gap-3">
    <button btn btnOutline type="button" [disabled]="f().submitting()" (click)="cancel()">
      Cancelar
    </button>
    <button btn btnPrimary type="submit" [btnLoading]="f().submitting()">Finalizar</button>
  </div>
</form>
