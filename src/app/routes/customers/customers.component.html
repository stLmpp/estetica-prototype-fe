<div class="flex flex-wrap items-center justify-between gap-4">
  <div>
    <h1 class="text-primary-800 dark:text-primary-300 text-2xl font-bold">Clientes</h1>
    <p class="text-sm text-neutral-500 dark:text-neutral-400">Gerencie os clientes cadastrados.</p>
  </div>
  @if (canCreateCustomer()) {
    <button
      btn
      btnPrimary
      type="button"
      [appPreloadLoader]="customerFormDialogLoader"
      (click)="openCreateDialog()"
    >
      <app-icon size="sm" color="white" [icon]="LucidePlus" />
      Novo cliente
    </button>
  }
</div>

<app-form-field>
  <label appLabel for="customer-search">Buscar por nome</label>
  <input
    id="customer-search"
    appInput
    type="search"
    placeholder="Ex: Maria Silva"
    [formField]="searchForm.name"
  />
</app-form-field>

@if (store.errorMessage(); as message) {
  <app-alert error>{{ message }}</app-alert>
}

<app-table
  [columns]="columns()"
  [data]="store.entities()"
  [trackBy]="trackBy"
  [loadingOverlay]="store.loading()"
/>

@if (!store.loading() && store.entities().length === 0) {
  <div
    class="rounded-xl border border-dashed border-neutral-300 p-8 text-center
      dark:border-neutral-700"
  >
    <p class="text-neutral-500 dark:text-neutral-400">Nenhum cliente encontrado.</p>
  </div>
}

<app-paginator
  mode="compact"
  [page]="store.page()"
  [pageSize]="pageSize"
  [length]="store.total()"
  [showPageSizeSelector]="false"
  [disabled]="store.loading()"
  (pageChange)="goToPage($event)"
/>

<ng-template #actionsTemplate let-row="row">
  <div class="flex items-center gap-1">
    <a
      iconBtn
      type="button"
      ariaLabel="Ver cliente"
      size="sm"
      [icon]="LucideEye"
      [routerLink]="['/customers', row.id]"
    ></a>

    @let canDelete = canDeleteCustomer();
    @if (canDelete) {
      <button
        iconBtn
        type="button"
        ariaLabel="Excluir cliente"
        size="sm"
        [icon]="LucideTrash2"
        (click)="openDeleteDialog(row)"
      ></button>
    }
  </div>
</ng-template>
