<h2
  id="customer-form-dialog-title"
  class="mb-6 text-lg font-bold text-neutral-800 dark:text-neutral-100"
>
  Novo cliente
</h2>

<form [formRoot]="f" class="flex flex-col gap-4">
  <app-form-field>
    <label appLabel for="customer-name">Nome</label>
    <input appInput [formField]="f.name" id="customer-name" type="text" />
  </app-form-field>

  <div class="grid grid-cols-2 gap-4">
    <app-form-field>
      <label appLabel for="customer-birth-date">Data de nascimento</label>
      <input appInput [formField]="f.birthDate" id="customer-birth-date" type="date" />
    </app-form-field>

    <app-form-field>
      <label appLabel for="customer-marital-status">Estado civil</label>
      <select appSelect [formField]="f.maritalStatus" id="customer-marital-status">
        <option value="">Selecione</option>
        <option [value]="MaritalStatus.Single">{{ MaritalStatus.Single }}</option>
        <option [value]="MaritalStatus.Married">{{ MaritalStatus.Married }}</option>
        <option [value]="MaritalStatus.Divorced">{{ MaritalStatus.Divorced }}</option>
        <option [value]="MaritalStatus.Widowed">{{ MaritalStatus.Widowed }}</option>
      </select>
    </app-form-field>
  </div>

  <app-form-field>
    <label appLabel for="customer-email">E-mail</label>
    <input appInput [formField]="f.email" id="customer-email" type="email" />
  </app-form-field>

  <app-form-field>
    <label appLabel for="customer-job-name">Profissão</label>
    <input appInput [formField]="f.jobName" id="customer-job-name" type="text" />
  </app-form-field>

  <app-form-field>
    <label appLabel for="customer-address">Endereço</label>
    <input appInput [formField]="f.address" id="customer-address" type="text" />
  </app-form-field>

  <div class="grid grid-cols-2 gap-4">
    <app-form-field>
      <label appLabel for="customer-zip-code">CEP</label>
      <input
        appInput
        [formField]="f.zipCode"
        id="customer-zip-code"
        type="text"
        inputmode="numeric"
        mask="00000-000"
        placeholder="00000-000"
      />
    </app-form-field>

    <app-form-field>
      <label appLabel for="customer-neighborhood">Bairro</label>
      <input appInput [formField]="f.neighborhood" id="customer-neighborhood" type="text" />
    </app-form-field>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <app-form-field>
      <label appLabel for="customer-city">Cidade</label>
      <input appInput [formField]="f.city" id="customer-city" type="text" />
    </app-form-field>

    <app-form-field>
      <label appLabel for="customer-state">Estado</label>
      <input appInput [formField]="f.state" id="customer-state" type="text" />
    </app-form-field>
  </div>

  <div>
    <div class="mb-2 flex items-center justify-between">
      <p class="text-sm font-medium text-neutral-700 dark:text-neutral-200">Telefones</p>
      <button btn btnOutline type="button" (click)="addPhone()">Adicionar telefone</button>
    </div>

    <div class="flex flex-col gap-3">
      @for (phone of f.phones; track $index; let i = $index) {
        <div class="flex items-end gap-2">
          <app-form-field class="flex-1">
            <label appLabel [for]="'customer-phone-number-' + i">Número</label>
            <input
              appInput
              [formField]="phone.number"
              [id]="'customer-phone-number-' + i"
              type="text"
              inputmode="numeric"
              mask="(00) 00000-0000"
              placeholder="(00) 00000-0000"
            />
          </app-form-field>

          <app-form-field class="flex-1">
            <label appLabel [for]="'customer-phone-type-' + i">Tipo</label>
            <select appSelect [formField]="phone.type" [id]="'customer-phone-type-' + i">
              <option [value]="PhoneType.Mobile">{{ PhoneType.Mobile }}</option>
              <option [value]="PhoneType.Home">{{ PhoneType.Home }}</option>
              <option [value]="PhoneType.Work">{{ PhoneType.Work }}</option>
            </select>
          </app-form-field>

          <button btn btnOutline type="button" (click)="removePhone(i)">Remover</button>
        </div>
      }
    </div>
  </div>

  @if (submitErrorMessage(); as message) {
    <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ message }}</p>
  }

  <div class="mt-2 flex justify-end gap-3">
    <button btn btnOutline type="button" [disabled]="f().submitting()" (click)="cancel()">
      Cancelar
    </button>
    <button btn btnPrimary type="submit" [btnLoading]="f().submitting()">Criar</button>
  </div>
</form>
